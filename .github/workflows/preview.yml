name: PR Preview

on:
  pull_request:
    branches:
      - main

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout main repo with submodules
        uses: actions/checkout@v4
        with:
          repository: careforknowledge/ctri-math
          token: ${{ secrets.DEPLOY_TOKEN }}
          fetch-depth: 0

      - name: Checkout content branch into submodule
        run: |
          cd content
          git fetch origin ${{ github.head_ref }}
          git checkout ${{ github.head_ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Build Quartz
        run: npx quartz build

      - name: Deploy Preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload

      - name: Comment Preview URL
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `${{ steps.deploy.outputs.command-output }}`;
            const match = output.match(/https:\/\/\S+\.workers\.dev/);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## Preview Deployment ✅\n\nPreview URL: ${match[0]}\n\nThis reflects the content in this PR exactly as it will appear on math.ctri.ng.`
              });
            }