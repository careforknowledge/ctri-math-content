name: PR Preview

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          repository: careforknowledge/ctri-math
          token: ${{ secrets.DEPLOY_TOKEN }}
          fetch-depth: 0
          path: ctri-math

      - name: Checkout content branch into submodule
        run: |
          cd ${{ github.workspace }}/ctri-math/content
          git fetch https://github.com/careforknowledge/ctri-math-content.git ${{ github.head_ref }}
          git checkout FETCH_HEAD

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ github.workspace }}/ctri-math
        run: npm install

      - name: Install Quartz plugins
        working-directory: ${{ github.workspace }}/ctri-math
        run: npx quartz plugin install

      - name: Build Quartz
        working-directory: ${{ github.workspace }}/ctri-math
        run: npx quartz build

      - name: Deploy Preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ github.workspace }}/ctri-math
          command: versions upload --preview-alias pr-${{ github.event.number }}

      - name: Comment Preview URL
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `${{ steps.deploy.outputs.command-output }}`;
            const match = output.match(/Version Preview URL:\s*(https:\/\/\S+)/);
            const url = match ? match[1] : null;

            const body = url
              ? `## Preview Deployment ✅\n\n**Preview URL:** ${url}\n\nThis preview updates automatically when you push new commits to this PR.`
              : `## Preview Deployment ⚠️\n\nDeployment succeeded but preview URL could not be extracted. Check the [Actions log](https://github.com/${context.repo.owner}/${context.repo.repo}/actions) for the URL.`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.data.find(c => c.body.includes('Preview Deployment'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }